[project]
name = "multi-model-agent"
version = "0.5.0"
description = "Resumable multi-model coding-agent control plane with durable storage, leases, routing, workers, and terminal-first CLI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "PyYAML>=6,<7",
]

[project.scripts]
multi-model-agent = "agent_platform.cli:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
redis = ["redis>=6,<7"]
all = ["psycopg[binary]>=3.2,<4", "redis>=6,<7"]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
