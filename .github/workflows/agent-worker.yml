name: agent-worker

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Existing control-plane task UUID (must already exist)
        required: true
        type: string
      task_prompt:
        description: Coding task for the agent
        required: true
        type: string
      max_steps:
        description: Maximum agent steps
        required: false
        default: '64'
        type: string
      repository:
        description: Target repository
        required: true
        type: string
      base_branch:
        description: Base branch
        required: false
        default: main
        type: string
      working_branch:
        description: Persistent worker branch
        required: true
        type: string
      callback_url:
        description: Control-plane callback URL
        required: true
        type: string
      checkpoint_json:
        description: Redacted resumable checkpoint JSON
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Validate control-plane task
        env:
          TASK_ID: ${{ inputs.task_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from uuid import UUID

          task_id = os.environ['TASK_ID']
          try:
              UUID(task_id)
          except ValueError as exc:
              raise SystemExit('task_id must be an existing control-plane UUID; create the task first instead of using an arbitrary external identifier') from exc

          url = os.environ['CALLBACK_URL'].rstrip('/') + '/api/tasks/' + task_id
          request = urllib.request.Request(url, headers={'Accept': 'application/json'})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  task = json.loads(response.read().decode('utf-8'))
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'control-plane task preflight failed: HTTP {exc.code}') from exc
          except Exception as exc:
              raise SystemExit(f'control-plane task preflight failed: {exc}') from exc

          if str(task.get('id')) != task_id:
              raise SystemExit('control-plane returned a different task id')
          if task.get('status') in {'completed', 'cancelled'}:
              raise SystemExit(f'control-plane task is not runnable: {task.get("status")}')
          print(f'control-plane task verified: {task_id} status={task.get("status")}')
          PY
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.base_branch }}
          token: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          path: workspace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare persistent branch
        working-directory: workspace
        env:
          WORKING_BRANCH: ${{ inputs.working_branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          CHECKPOINT_JSON: ${{ inputs.checkpoint_json }}
        run: |
          git fetch origin --prune
          if [ -z "${CHECKPOINT_JSON//[[:space:]]/}" ]; then
            git checkout -B "$WORKING_BRANCH" "origin/$BASE_BRANCH"
            if git show-ref --verify --quiet "refs/remotes/origin/$WORKING_BRANCH"; then
              git push --force-with-lease origin "HEAD:$WORKING_BRANCH"
            else
              git push --set-upstream origin "$WORKING_BRANCH"
            fi
          elif git show-ref --verify --quiet "refs/remotes/origin/$WORKING_BRANCH"; then
            git checkout -B "$WORKING_BRANCH" "origin/$WORKING_BRANCH"
          else
            git checkout -B "$WORKING_BRANCH" "origin/$BASE_BRANCH"
          fi
      - name: Install agent
        working-directory: workspace
        run: pip install -e '.[dev]'
      - name: Execute agent
        id: agent
        working-directory: workspace
        env:
          AGENT_TASK_PROMPT: ${{ inputs.task_prompt }}
          AGENT_TASK_ID: ${{ inputs.task_id }}
          AGENT_MAX_STEPS: ${{ inputs.max_steps }}
          AGENT_CHECKPOINT_JSON: ${{ inputs.checkpoint_json }}
          AGENT_TIMEOUT_SECONDS: '19800'
          AGENT_WORKSPACE: ${{ github.workspace }}/workspace
          AGENT_MODEL_MAX_TOKENS: '1024'
          AGENT_ALLOW_PAID_OPENROUTER: 'false'
          AGENT_OPENROUTER_FREE_MODEL: 'openrouter/free'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_BASE_URL: ${{ secrets.AGENT_BASE_URL }}
          AGENT_MODEL: ${{ secrets.AGENT_MODEL }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          AGENT_WORKER_ID: github-actions-${{ github.run_id }}
        continue-on-error: true
        run: python -m agent_platform.worker_entry
      - name: Read worker result
        id: result
        working-directory: workspace
        run: |
          if [ ! -f .agent-result.json ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.agent-result.json').read_text(encoding='utf-8'))
          status = str(data.get('status', 'failed'))
          if status not in {'completed', 'checkpointed'}:
              status = 'failed'
          print(f'worker status: {status}')
          with open(__import__('os').environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'status={status}\n')
          PY
      - name: Commit and push verified progress
        if: steps.result.outputs.status == 'completed' || steps.result.outputs.status == 'checkpointed'
        working-directory: workspace
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          WORKING_BRANCH: ${{ inputs.working_branch }}
        run: |
          git config user.name 'multi-model-agent[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .agent-result.json 2>/dev/null || true
          rm -f worker-status.txt
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git commit -m 'agent: apply verified task progress'
          git push --set-upstream origin "$WORKING_BRANCH"
      - name: Open or update PR
        if: steps.result.outputs.status == 'completed' || steps.result.outputs.status == 'checkpointed'
        working-directory: workspace
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          WORKING_BRANCH: ${{ inputs.working_branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          if [ -z "${AGENT_GITHUB_TOKEN:-}" ]; then
            echo 'Skipping PR creation: AGENT_GITHUB_TOKEN is not configured.'
            exit 0
          fi
          if gh pr view "$WORKING_BRANCH" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          if [ "$(git rev-list --count "origin/$BASE_BRANCH..HEAD")" -gt 0 ]; then
            gh pr create --repo "$TARGET_REPOSITORY" --base "$BASE_BRANCH" --head "$WORKING_BRANCH" --title 'agent: verified task changes' --body 'Resumable automated coding-agent task.'
          fi
      - name: Report result to control plane
        if: always()
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
          TASK_ID: ${{ inputs.task_id }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          WORKER_ID: github-actions-${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib, hmac, json, os, time, urllib.error, urllib.request

          path = os.path.join(os.environ['GITHUB_WORKSPACE'], 'workspace', '.agent-result.json')
          if os.path.exists(path):
              with open(path, encoding='utf-8') as f:
                  payload = json.load(f)
          else:
              payload = {'status': 'failed', 'error': 'worker ended before producing a result'}

          task_id = os.environ['TASK_ID']
          payload.update({
              'task_id': task_id,
              'run_id': os.environ['RUN_ID'],
              'worker_id': os.environ['WORKER_ID'],
              'attempt': int(os.environ['ATTEMPT']),
          })
          data = json.dumps(payload, ensure_ascii=False, default=str, separators=(',', ':')).encode()
          secret = os.environ.get('CALLBACK_TOKEN', '')
          headers = {'Content-Type': 'application/json'}

          last_error = None
          for attempt in range(1, 4):
              timestamp = str(int(time.time()))
              request_headers = dict(headers)
              if secret:
                  signature = hmac.new(secret.encode(), timestamp.encode() + b'.' + data, hashlib.sha256).hexdigest()
                  request_headers.update({'X-Agent-Timestamp': timestamp, 'X-Agent-Signature': 'sha256=' + signature})
              request = urllib.request.Request(
                  os.environ['CALLBACK_URL'].rstrip('/') + '/api/tasks/' + task_id + '/worker-callback',
                  data=data,
                  headers=request_headers,
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(response.read().decode())
                      raise SystemExit(0)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode(errors='replace')
                  if 400 <= exc.code < 500:
                      raise SystemExit(f'control-plane callback rejected: HTTP {exc.code}: {body}') from exc
                  last_error = f'HTTP {exc.code}: {body}'
              except Exception as exc:
                  last_error = str(exc)
              if attempt < 3:
                  time.sleep(2 ** attempt)

          raise SystemExit(f'control-plane callback failed after retries: {last_error}')
          PY