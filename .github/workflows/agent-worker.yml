name: agent-worker

on:
  workflow_dispatch:
    inputs:
      task_prompt:
        description: Coding task for the agent
        required: true
        type: string
      max_steps:
        description: Maximum agent steps
        required: false
        default: '64'
        type: string
      repository:
        description: Target repository, e.g. owner/name
        required: true
        type: string
      base_branch:
        description: Branch to base the agent change on
        required: false
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.base_branch }}
          token: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          path: workspace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install agent
        run: pip install -e '.[dev]'
      - name: Execute agent
        env:
          AGENT_TASK_PROMPT: ${{ inputs.task_prompt }}
          AGENT_MAX_STEPS: ${{ inputs.max_steps }}
          AGENT_WORKSPACE: ${{ github.workspace }}/workspace
          AGENT_BASE_URL: ${{ secrets.AGENT_BASE_URL }}
          AGENT_MODEL: ${{ secrets.AGENT_MODEL }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
        run: python -m agent_platform.worker_entry
      - name: Commit and open PR
        working-directory: workspace
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          git config user.name 'multi-model-agent[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No verified changes produced.'
            exit 0
          fi
          BRANCH="agent/task-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m 'agent: apply verified task changes'
          git push --set-upstream origin "$BRANCH"
          gh pr create --repo "$TARGET_REPOSITORY" --base "$BASE_BRANCH" --head "$BRANCH" --title 'agent: verified task changes' --body "Automated coding-agent run ${GITHUB_RUN_ID}. Changes were produced only after the worker-side verification loop completed."
